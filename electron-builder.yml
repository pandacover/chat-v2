# Installers for Windows (NSIS .exe) and macOS (.dmg). CI builds and publishes them on
# every push to main (.github/workflows/release.yml); the app updates itself from there.
appId: com.pandacover.chatv2
productName: chat-v2
copyright: Copyright © pandacover
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!out-test/**"
asar: true
# The UI is English-only, so Chromium's other locale packs (about 48 MB) are left out.
# "en-US" also keeps macOS's en.lproj.
electronLanguages: [en-US]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # Per-user install without admin rights, so updates install silently on restart.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Ad-hoc signed: there is no Developer ID certificate yet (that would add notarising and
  # in-place updates). Don't drop to unsigned: macOS then can't tie privacy choices to the
  # app, and the microphone prompt comes back after every Allow or Don't Allow.
  identity: "-"
  # Signing turns on the hardened runtime, which blocks the microphone without the
  # audio-input entitlement.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The screen capture helper (scripts/build-mac-capture.ts), outside the asar so it can run.
  # Already universal, so the universal build keeps it as it is; signed with the app.
  extraResources:
    - from: native/mac-capture/out/chat-v2-capture
      to: chat-v2-capture
  extendInfo:
    NSMicrophoneUsageDescription: chat-v2 uses the microphone for voice input.
    # Computer use types through System Events when it can't post the characters itself.
    NSAppleEventsUsageDescription: chat-v2 uses System Events to type into apps during computer use.
  # One build per architecture: a universal app carries both and is twice the size.
  target:
    # The universal DMG is only for apps from before the split, whose updater downloads
    # "-universal.dmg". Drop it once those have updated.
    - target: dmg
      arch: [arm64, x64, universal]
    # The zip carries the update metadata (latest-mac.yml).
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Installers are published as releases of this (public) repository.
publish:
  provider: github
  owner: pandacover
  repo: chat-v2
  releaseType: draft
