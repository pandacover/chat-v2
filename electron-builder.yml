# Installers for Windows (NSIS .exe) and macOS (.dmg). CI builds and publishes them on
# every push to main (.github/workflows/release.yml); the app updates itself from there.
appId: com.pandacover.chatv2
productName: Tomo
copyright: Copyright © pandacover
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!out-test/**"
  # The Claude Agent SDK is the one package outside out/ (see electron.vite.config.ts), and it
  # starts Claude Code, a native binary of about 370 MB per platform: each build ships only the
  # one for its own platform and processor.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-${platform}-${arch}/**"
asar: true
# Outside the archive, where it can run; src/main/index.ts starts it from there.
asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**"
# The UI is English-only, so Chromium's other locale packs (about 48 MB) are left out.
# "en-US" also keeps macOS's en.lproj.
electronLanguages: [en-US]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # A literal chat-v2- prefix: the update feed (latest.yml) and earlier releases name the files so.
  artifactName: chat-v2-${version}-setup.${ext}

nsis:
  # Per-user install without admin rights, so updates install silently on restart.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Releases are signed with one long-lived self-signed certificate (scripts/make-mac-cert.sh):
  # release.yml puts it in a keychain (scripts/ci-mac-signing.sh) and passes
  # -c.mac.identity="chat-v2 Code Signing".
  # Its designated requirement (identifier + certificate hash) is the same for every version,
  # so macOS keeps the app's privacy permissions across updates and Squirrel.Mac installs them in
  # place. Not notarised (that needs a paid Developer ID). Builds without the certificate (pull
  # requests, local) are ad-hoc signed; but electron-builder looks "-" up as a name first, so on a
  # Mac with the release certificate installed (its name has a "-") it signs with that. Never unsigned: macOS then can't tie privacy choices to the
  # app, and the microphone prompt comes back after every Allow or Don't Allow.
  identity: "-"
  notarize: false
  # Signing turns on the hardened runtime, which blocks the microphone without the
  # audio-input entitlement.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Tomo uses the microphone for voice input.
    # Computer use drives other apps through System Events (osascript) on macOS.
    NSAppleEventsUsageDescription: Tomo uses other apps for you when you turn on computer use in a chat.
  # Apple silicon only: no Intel or universal builds.
  target:
    # The DMG is for first installs, and for ad-hoc signed apps, which still update by opening
    # it (chat-v2-<version>-arm64.dmg): keep this name.
    - target: dmg
      arch: [arm64]
    # Squirrel.Mac installs updates from the zip, described by latest-mac.yml.
    - target: zip
      arch: [arm64]
  # A literal chat-v2- prefix, not ${productName}: ad-hoc signed apps open the DMG by this name.
  artifactName: chat-v2-${version}-${arch}.${ext}

# Installers are published as releases of this (public) repository.
publish:
  provider: github
  owner: pandacover
  repo: chat-v2
  releaseType: draft
