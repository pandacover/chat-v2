# Installers for Windows (NSIS .exe) and macOS (.dmg). CI builds and publishes them on
# every push to main (.github/workflows/release.yml); the app updates itself from there.
appId: com.pandacover.chatv2
productName: chat-v2
copyright: Copyright © pandacover
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!out-test/**"
asar: true
# The UI is English-only, so Chromium's other locale packs (about 48 MB) are left out.
# "en-US" also keeps macOS's en.lproj.
electronLanguages: [en-US]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # Per-user install without admin rights, so updates install silently on restart.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Releases are signed with one long-lived self-signed certificate (scripts/make-mac-cert.sh):
  # release.yml puts it in a keychain (scripts/ci-mac-signing.sh) and passes
  # -c.mac.identity="chat-v2 Code Signing".
  # Its designated requirement (identifier + certificate hash) is the same for every version,
  # so macOS keeps the app's privacy permissions across updates and Squirrel.Mac installs them in
  # place. Not notarised (that needs a paid Developer ID). Builds without the certificate (pull
  # requests, local) are ad-hoc signed. Never unsigned: macOS then can't tie privacy choices to the
  # app, and the microphone prompt comes back after every Allow or Don't Allow.
  identity: "-"
  notarize: false
  # Signing turns on the hardened runtime, which blocks the microphone without the
  # audio-input entitlement.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The screen capture helper (scripts/build-mac-capture.ts), outside the asar so it can run.
  # Already universal, so the universal build keeps it as it is; signed with the app.
  extraResources:
    - from: native/mac-capture/out/chat-v2-capture
      to: chat-v2-capture
  extendInfo:
    NSMicrophoneUsageDescription: chat-v2 uses the microphone for voice input.
    # Computer use types through System Events when it can't post the characters itself.
    NSAppleEventsUsageDescription: chat-v2 uses System Events to type into apps during computer use.
  # One build per architecture: a universal app carries both and is twice the size. Apps from
  # before the split download "-universal.dmg": release.yml uploads the Intel DMG under that name
  # too (it runs on both through Rosetta, and the next update moves Apple silicon to arm64).
  target:
    # The DMGs are for first installs, and for ad-hoc signed apps, which still update by opening
    # the DMG for their processor (chat-v2-<version>-<arch>.dmg): keep these names.
    - target: dmg
      arch: [arm64, x64]
    # Squirrel.Mac installs updates from the zips, which also carry latest-mac.yml.
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Installers are published as releases of this (public) repository.
publish:
  provider: github
  owner: pandacover
  repo: chat-v2
  releaseType: draft
