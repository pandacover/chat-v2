# Checks a branch before it reaches main: runs the tests on a Mac, builds the app, and checks it
# quits and packages signed. main itself is checked by release.yml.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or pull request) replaces a run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # The app quits within seconds of app.quit(), even when closing its services hangs, and
      # leaves no child process behind (hidden: no window is shown).
      - name: Quit the app
        run: bun scripts/quit-smoke.ts
      # The installers' app bundles, unpublished, to check each is signed and ships the Claude
      # Code binary for its processor. Ad-hoc: branches and forks have no access to the release
      # certificate (release.yml checks the self-signed signature).
      - name: Package the app (no installers)
        run: bun scripts/claude-binaries.ts && bunx electron-builder --mac dir --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder skips signing on pull-request builds by default; this one is ad-hoc
          # and needs no secrets, so sign it like any other build.
          CSC_FOR_PULL_REQUEST: true
      - name: Check the packaged apps
        run: |
          bash scripts/ci-mac-verify.sh dist/mac/chat-v2.app adhoc x64
          bash scripts/ci-mac-verify.sh dist/mac-arm64/chat-v2.app adhoc arm64
