# Checks a branch before it reaches main: runs the tests on a Mac, builds the app, and checks it
# quits and packages signed. main itself is checked by release.yml.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or pull request) replaces a run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # The app quits within seconds of app.quit(), even when closing its services hangs, and
      # leaves no child process behind (hidden: no window is shown).
      - name: Quit the app
        run: bun scripts/quit-smoke.ts
      # The installer's app bundle (Apple silicon only), unpublished, to check it is signed and
      # ships the Claude Code binary. Ad-hoc: branches and forks have no access to the release
      # certificate (release.yml checks the self-signed signature).
      - name: Package the app (no installers)
        run: bunx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder skips signing on pull-request builds by default; this one is ad-hoc
          # and needs no secrets, so sign it like any other build.
          CSC_FOR_PULL_REQUEST: true
      - name: Check the packaged app
        run: bash scripts/ci-mac-verify.sh dist/mac-arm64/Tomo.app adhoc arm64

  # Linux computer use against a real X display: a virtual screen (Xvfb) with a window manager,
  # driving real xterm windows (test/computer/linux.test.ts). Without a display those tests skip.
  linux-computer-use:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install X11 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xterm xdotool x11-utils wmctrl imagemagick xdg-utils
      - name: Linux computer use tests on a virtual screen
        run: xvfb-run -a -s "-screen 0 1280x800x24" sh -c 'openbox & sleep 1; bun test test/computer/linux.test.ts'
