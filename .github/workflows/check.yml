# Checks a branch before it reaches main: builds the macOS capture helper (Swift, which only
# builds on a Mac), checks it, and runs the tests there. main itself is checked by release.yml.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or pull request) replaces a run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Rebuilt only when its source or Xcode changes.
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum | cut -c1-12)" >>"$GITHUB_OUTPUT"
      - name: Cache the capture helper
        id: helper
        uses: actions/cache@v4
        with:
          path: native/mac-capture/out
          key: mac-capture-${{ steps.xcode.outputs.version }}-${{ hashFiles('native/mac-capture/main.swift', 'scripts/build-mac-capture.ts') }}
      - if: steps.helper.outputs.cache-hit != 'true'
        run: bun run build:mac-capture
      # Both architectures, ScreenCaptureKit linked, and it starts: --selftest only reports what
      # is available (no capture, no permission prompt).
      - name: Check the capture helper
        run: |
          helper=native/mac-capture/out/chat-v2-capture
          lipo -info "$helper"
          lipo "$helper" -verify_arch arm64 x86_64
          otool -L "$helper" | grep -q ScreenCaptureKit.framework
          otool -l "$helper" | grep -A3 LC_BUILD_VERSION | grep -q 'minos 13.0'
          "$helper" --selftest | tee selftest.json
          grep -q '"selftest":true' selftest.json
      # A real stream, screenshot, close-up and change reports: the runners allow Screen
      # Recording. The pictures are kept to look at.
      - name: Capture the screen with the helper
        run: bun scripts/mac-capture-smoke.ts --out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-smoke
          path: smoke/
          if-no-files-found: ignore
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # The app quits within seconds of app.quit(), even when closing its services hangs, and
      # leaves no helper process behind (hidden: no window is shown).
      - name: Quit the app
        run: bun scripts/quit-smoke.ts
      # The installers' app bundles, unpublished, to check the app and the helper are signed and
      # the helper ships in each. Ad-hoc: branches and forks have no access to the release
      # certificate (release.yml checks the self-signed signature).
      - name: Package the app (no installers)
        run: bunx electron-builder --mac dir --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check the packaged apps
        run: |
          for app in dist/mac/chat-v2.app dist/mac-arm64/chat-v2.app; do
            bash scripts/ci-mac-verify.sh "$app" adhoc
          done
