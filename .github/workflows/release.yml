# Builds installers on every push to main and publishes them as releases of this
# repository, where installed apps pick them up (src/main/updater.ts).
# Secrets: MAC_CERT_P12 and MAC_CERT_PASSWORD, the self-signed certificate every macOS release is
# signed with (scripts/make-mac-cert.sh). Windows stays unsigned; uploads use GITHUB_TOKEN.
#
# Windows and macOS run apart, and neither holds up the other: the release is published as soon as
# the tests and either platform's build are done, and the other platform adds its files when it
# finishes. Until then, and if it fails, that platform's apps find no update file (latest.yml or
# latest-mac.yml) in the newest release and quietly stay on the version they have. Runs don't wait
# for each other either (every run has its own version), so a slow build never holds up the next.
#
# Every call to GitHub's release API goes through scripts/ci-release.sh, which retries: an upload
# that got a 502 once failed a whole release (0.1.40), Mac included.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every run gets a higher version, so installed apps always see it as newer.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  # Runs beside the builds; publishing waits for it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Create the draft up front: if each platform job created its own, they would race
  # and publish two releases with the same tag.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft release
        run: bash scripts/ci-release.sh prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Set version
        run: npm pkg set version=${{ env.VERSION }}
      - run: bun run build
      # Not uploaded by electron-builder: it doesn't retry, and one 502 failed the release.
      - name: Build the Windows installer and update
        run: bunx electron-builder --win --publish never
        env:
          # No certificate: Windows is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload the Windows installer and update
        # The installer, its blockmap, and latest.yml (written with --publish never too).
        shell: bash
        run: bash scripts/ci-release.sh upload "dist/chat-v2-${VERSION}-setup.exe" "dist/chat-v2-${VERSION}-setup.exe.blockmap" dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One publisher per platform, so either can release without the other. The first to get here
  # publishes; the other finds it published and leaves it be. The commit message comes in through
  # the environment, not pasted into a script: quotes or backticks in it would break the command.
  publish-windows:
    needs: [test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release once the tests and Windows are done
        run: bash scripts/ci-release.sh publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}

  publish-mac:
    needs: [test, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release once the tests and the Mac build are done
        run: bash scripts/ci-release.sh publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}

  # Apple silicon only. Its files go into the release whether it is still a draft or already
  # published, and only once they are checked: a build that fails the checks never reaches anyone.
  # Its failing leaves the Windows release alone, and the Windows build's failing leaves it alone.
  mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The runner is Apple silicon, so bun installs the arm64 Claude Code binary the app ships.
      - run: bun install --frozen-lockfile
      - name: Set version
        run: npm pkg set version=${{ env.VERSION }}
      - run: bun run build
      - name: Set up the signing certificate
        run: bash scripts/ci-mac-signing.sh
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      # Not uploaded here: electron-builder won't add files to a release that's already published.
      - name: Build and sign the macOS installer and update
        run: bunx electron-builder --mac --publish never -c.mac.identity="chat-v2 Code Signing"
        env:
          # Only the identity named above, never another one found on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Signed with the release certificate, with the designated requirement every version shares,
      # and the Claude Code binary signed and working (scripts/ci-mac-verify.sh). The zip is checked
      # too: it is what Squirrel.Mac installs.
      - name: Check the macOS signatures
        run: |
          bash scripts/ci-mac-verify.sh dist/mac-arm64/Tomo.app self-signed arm64
          unzipped="$RUNNER_TEMP/zip-arm64"
          ditto -x -k "dist/chat-v2-${VERSION}-arm64.zip" "$unzipped"
          bash scripts/ci-mac-verify.sh "$unzipped/Tomo.app" self-signed arm64
      - name: Upload the macOS installer and update
        # The DMG, the zip, their blockmaps, and latest-mac.yml (written with --publish never too).
        run: bash scripts/ci-release.sh upload dist/chat-v2-"${VERSION}"-arm64.dmg* dist/chat-v2-"${VERSION}"-arm64.zip* dist/latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A run that fails or is cancelled deletes its draft, so half-uploaded drafts don't pile up.
  # Only a draft: a release either platform published is never touched.
  cleanup:
    needs: [prepare, test, windows, mac, publish-windows, publish-mac]
    if: ${{ always() && (failure() || cancelled()) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Delete the draft release
        run: bash scripts/ci-release.sh cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
