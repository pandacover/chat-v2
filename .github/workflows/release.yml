# Builds installers on every push to main and publishes them as releases of this
# repository, where installed apps pick them up (src/main/updater.ts).
# Uses the workflow's own GITHUB_TOKEN; no extra secrets are needed.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Every run gets a higher version, so installed apps always see it as newer.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Create the draft up front: if each platform job created its own, they would race
  # and publish two releases with the same tag.
  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        run: |
          gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 ||
            gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft --title "${VERSION}" --target "${GITHUB_SHA}" --notes "Building…"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Set version
        run: npm pkg set version=${{ env.VERSION }}
      - run: bun run build
      - name: Build and upload installers (draft release)
        run: bunx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No certificates to find: Windows is unsigned, macOS ad-hoc signed (electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # electron-builder can skip signing without failing, which shipped a Mac app that kept
      # asking for the microphone. A bare linker signature still passes --verify; the
      # identifier is what tells them apart. Failing here leaves the release a draft.
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac/chat-v2.app dist/mac-arm64/chat-v2.app dist/mac-universal/chat-v2.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv --verbose=2 "$app" 2>&1)
            echo "$info"
            grep -qx 'Identifier=com.pandacover.chatv2' <<<"$info"
            codesign -d --entitlements - "$app" 2>&1 | grep -q com.apple.security.device.audio-input
            plutil -p "$app/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft once every platform has uploaded
        # The commit message comes in through the environment, not pasted into the script: quotes
        # or backticks in it would otherwise break the command (or run as shell).
        run: |
          gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest \
            --notes "Built from ${GITHUB_SHA::7}: ${COMMIT_MESSAGE}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
